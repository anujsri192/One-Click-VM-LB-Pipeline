name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan


  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan

      - name: Terraform Apply
        working-directory: Environment/Pre-prod
        run: terraform apply -auto-approve