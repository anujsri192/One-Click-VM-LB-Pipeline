name: Terraform

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # =========================
  # TERRAFORM PLAN
  # =========================
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan


  # =========================
  # TERRAFORM APPLY
  # =========================
  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan

      - name: Terraform Apply
        working-directory: Environment/Pre-prod
        run: terraform apply -auto-approve