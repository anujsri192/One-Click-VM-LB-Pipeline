name: Terraform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan
