name: Terraform

on:
  # Feature branch par push = PLAN
  push:
    branches:
      - feature/one-click-vm
      - main

  # PR to main = PLAN
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # TERRAFORM PLAN
  # ==========================================
  terraform-plan:
    name: Terraform Plan
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/feature/one-click-vm' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/Pre-prod
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Environment/Pre-prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/Pre-prod
        run: terraform plan


  # ==========================================
  # TERRAFORM APPLY - MAIN ONLY
  # ==========================================
  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environment/Pre-prod
        run: terraform init

      - name: Terraform Apply
        working-directory: Environment/Pre-prod
        run: terraform apply -auto-approve